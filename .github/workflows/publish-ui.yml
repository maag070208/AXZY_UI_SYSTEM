name: Publish UI System

on:
  workflow_dispatch:
    inputs:
      increment:
        description: "Version increment"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Increment version
        run: |
          npm version ${{ github.event.inputs.increment || 'patch' }} \
          -m "chore(release): bump version to %s"

      - name: Build bundle
        run: yarn run bundle

      - name: Build package
        run: yarn pack

      - name: Publish package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push version changes
        run: |
          git push
          git push --tags
